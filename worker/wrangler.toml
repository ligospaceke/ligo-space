name = "ligo-api"
main = "src/index.js"
compatibility_date = "2024-01-01"

# Replace YOUR-DOMAIN.org with your real domain (it must be on Cloudflare DNS)
routes = [{ pattern = "YOUR-DOMAIN.org/api/*", zone_name = "YOUR-DOMAIN.org" }]

[[d1_databases]]
binding = "DB"
database_name = "ligo"
database_id = "6d6e177a-37b9-4c8d-9b19-fc50dbcc2642"

[ai]
binding = "AI"

[vars]
SUPABASE_URL = "https://lpnnntuelgaisoiimuka.supabase.co"   # Project Settings > API > Project URL
SITE_URL = "https://YOUR-DOMAIN.org"
SIGNUP = "invite"                      # "invite" now; change to "open" later
FROM_EMAIL = "L.I.G.O. SPACE <ligospace.ke@gmail.com>"
# Secrets (never put these in files or chat): wrangler secret put RESEND_API_KEY  and  wrangler secret put SUPABASE_SERVICE_KEY
